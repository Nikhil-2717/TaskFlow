<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            min-height:100vh;
            background:#0f172a;
            overflow-x:hidden;
            color:white;
            position:relative;
        }

        /* Animated Background */

        body::before{
            content:'';
            position:fixed;
            width:600px;
            height:600px;
            background:#7c3aed;
            border-radius:50%;
            top:-200px;
            left:-200px;
            filter:blur(120px);
            opacity:0.5;
            animation:move1 10s infinite alternate;
        }

        body::after{
            content:'';
            position:fixed;
            width:500px;
            height:500px;
            background:#06b6d4;
            border-radius:50%;
            bottom:-200px;
            right:-200px;
            filter:blur(120px);
            opacity:0.4;
            animation:move2 10s infinite alternate;
        }

        @keyframes move1{
            0%{
                transform:translate(0,0);
            }
            100%{
                transform:translate(100px,80px);
            }
        }

        @keyframes move2{
            0%{
                transform:translate(0,0);
            }
            100%{
                transform:translate(-100px,-50px);
            }
        }

        .main-container{
            position:relative;
            z-index:2;
            padding-top:50px;
            padding-bottom:50px;
        }

        .app-title{
            text-align:center;
            font-size:64px;
            font-weight:800;
            background:linear-gradient(to right,#ffffff,#a5b4fc);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#cbd5e1;
            font-size:18px;
            margin-bottom:50px;
        }

        .glass-box{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:28px;
            padding:30px;
            box-shadow:
            0 8px 32px rgba(0,0,0,0.35),
            inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .section-title{
            font-size:26px;
            font-weight:700;
            margin-bottom:25px;
            display:flex;
            align-items:center;
            gap:10px;
        }

        .task-card{
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:18px;
            padding:18px 20px;
            margin-bottom:16px;
            transition:0.35s ease;
        }

        .task-card:hover{
            transform:translateY(-5px) scale(1.01);
            background:rgba(255,255,255,0.09);
            box-shadow:0 10px 25px rgba(0,0,0,0.25);
        }

        .task-text{
            font-size:17px;
            font-weight:500;
            color:#f8fafc;
        }

        .btn-custom{
            width:42px;
            height:42px;
            border:none;
            border-radius:12px;
            display:inline-flex;
            justify-content:center;
            align-items:center;
            margin-left:8px;
            transition:0.3s;
            font-size:15px;
        }

        .btn-done{
            background:#10b981;
            color:white;
        }

        .btn-done:hover{
            background:#34d399;
            transform:scale(1.1);
        }

        .btn-delete{
            background:#ef4444;
            color:white;
        }

        .btn-delete:hover{
            background:#f87171;
            transform:scale(1.1);
        }

        .btn-edit{
            background:#3b82f6;
            color:white;
        }

        .btn-edit:hover{
            background:#60a5fa;
            transform:scale(1.1);
        }

        .completed-card{
            opacity:0.75;
        }

        .completed-card .task-text{
            text-decoration:line-through;
            color:#cbd5e1;
        }

        .task-scroll{
            max-height:500px;
            overflow-y:auto;
            padding-right:8px;
        }

        .task-scroll::-webkit-scrollbar{
            width:8px;
        }

        .task-scroll::-webkit-scrollbar-thumb{
            background:#475569;
            border-radius:10px;
        }

        .date{
            color:#94a3b8;
            margin-bottom:25px;
            font-size:15px;
        }

        .add-task-section{
            margin-top:40px;
        }

        .task-input{
            height:65px;
            border:none;
            border-radius:18px;
            background:rgba(255,255,255,0.08);
            color:white;
            padding-left:22px;
            font-size:16px;
        }

        .task-input::placeholder{
            color:#cbd5e1;
        }

        .task-input:focus{
            background:rgba(255,255,255,0.12);
            color:white;
            box-shadow:none;
        }

        .add-btn{
            width:190px;
            border:none;
            border-radius:18px;
            background:linear-gradient(135deg,#7c3aed,#3b82f6);
            color:white;
            font-size:17px;
            font-weight:600;
            transition:0.35s;
        }

        .add-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(59,130,246,0.35);
        }

        @media(max-width:768px){

            .app-title{
                font-size:42px;
            }

            .glass-box{
                margin-bottom:25px;
            }

            .add-btn{
                width:100%;
                height:60px;
            }

            .mobile-gap{
                gap:15px;
                flex-direction:column;
            }

        }

    </style>

</head>

<body>

<div class="container main-container">

    <h1 class="app-title">TaskFlow</h1>

    <p class="subtitle">
        Organize your work beautifully and stay productive every day.
    </p>

    <div class="row g-4">

        <!-- Pending Tasks -->

        <div class="col-lg-7">

            <div class="glass-box">

                <div class="section-title">
                    <i class="fa fa-tasks"></i>
                    My Tasks
                </div>

                <div class="date">
                    {% now "jS F Y" %}
                </div>

                <div class="task-scroll">

                    {% for task in tasks %}

                    <div class="task-card">

                        <div class="d-flex justify-content-between align-items-center">

                            <div class="task-text">
                                {{ task.task }}
                            </div>

                            <div>

                                <a href="{% url 'mark_as_done' task.pk %}"
                                   class="btn btn-custom btn-done">

                                    <i class="fa fa-check"></i>

                                </a>

                                <a href="{% url 'delete_task' task.id %}"
                                   class="btn btn-custom btn-delete">

                                    <i class="fa fa-trash"></i>

                                </a>

                                <a href="{% url 'edit_task' task.id %}"
                                   class="btn btn-custom btn-edit">

                                    <i class="fa fa-pencil"></i>

                                </a>

                            </div>

                        </div>

                    </div>

                    {% endfor %}

                </div>

            </div>

        </div>

        <!-- Completed Tasks -->

        <div class="col-lg-5">

            <div class="glass-box">

                <div class="section-title">
                    <i class="fa fa-check-circle"></i>
                    Completed
                </div>

                <div class="task-scroll">

                    {% for task in completed_tasks %}

                    <div class="task-card completed-card">

                        <div class="d-flex justify-content-between align-items-center">

                            <div class="task-text">
                                {{ task.task }}
                            </div>

                            <div>

                                <a href="{% url 'mark_as_undone' task.pk %}"
                                   class="btn btn-custom btn-delete">

                                    <i class="fa fa-times"></i>

                                </a>

                            </div>

                        </div>

                    </div>

                    {% endfor %}

                </div>

            </div>

        </div>

    </div>

    <!-- Add Task -->

    <div class="row justify-content-center add-task-section">

        <div class="col-lg-8">

            <form action="{% url 'addTask' %}" method="POST">

                {% csrf_token %}

                <div class="d-flex mobile-gap">

                    <input type="text"
                           name="task"
                           class="form-control task-input"
                           placeholder="What needs to be done today?">

                    <button type="submit" class="add-btn">

                        <i class="fa fa-plus"></i>
                        Add Task

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
