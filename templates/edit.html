<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            font-family:'Poppins', sans-serif;
        }

        body{
            background: linear-gradient(135deg, #141e30, #243b55);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .edit-box{
            width:600px;
            background:rgba(255,255,255,0.08);
            padding:40px;
            border-radius:20px;
            backdrop-filter:blur(12px);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            border:1px solid rgba(255,255,255,0.1);
        }

        .title{
            color:white;
            text-align:center;
            margin-bottom:30px;
            font-weight:600;
        }

        .form-control{
            height:60px;
            border-radius:12px;
            border:none;
            padding-left:20px;
        }

        .update-btn{
            width:100%;
            height:55px;
            border:none;
            border-radius:12px;
            background:#7c4dff;
            color:white;
            font-size:18px;
            font-weight:600;
            margin-top:20px;
            transition:0.3s;
        }

        .update-btn:hover{
            background:#9575ff;
        }

    </style>

</head>

<body>

<div class="edit-box">

    <h2 class="title">Edit Task</h2>

    <form action="{% url 'edit_task' get_task.pk %}" method="POST">

        {% csrf_token %}

        <input type="text"
               name="task"
               class="form-control"
               value="{{ get_task.task }}">

        <button type="submit" class="update-btn">

            Update Task

        </button>

    </form>

</div>

</body>
</html>
